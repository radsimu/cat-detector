[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-detector"
version = "0.1.0"
description = "Surveillance camera cat detection service with webhook alerts and labeling UI"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "opencv-python>=4.10.0",
    "ultralytics>=8.2.0",  # YOLOv8
    "pillow>=10.4.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
cat-detector = "cat_detector.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_detector"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
